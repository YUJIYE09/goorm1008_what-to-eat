<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="모임 조건을 입력하고 다 같이 식당을 골라보세요." />
    <meta name="theme-color" content="#e8590c" />

    <!-- 카카오톡·문자로 링크를 보낼 때 보이는 미리보기 (제목·설명·이미지) -->
    <!-- 카카오톡은 이미지 주소가 https로 시작하는 전체 주소여야 보여줘요 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="뭐먹지?" />
    <meta property="og:title" content="뭐먹지? · 모임 식당, 다 같이 투표로 정해요" />
    <meta property="og:description" content="링크를 열고 마음에 드는 식당에 한 표! 결과는 실시간으로 보여요." />
    <meta property="og:url" content="https://goorm1008-what-to-eat.vercel.app/" />
    <meta property="og:image" content="https://goorm1008-what-to-eat.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>" />
    <title>뭐먹지?</title>
    <style>
      /* CSS 파일이 불러와지기 전에도 로딩 화면이 보이도록 여기에 직접 적어둬요 */
      .loading { display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; min-height: 100vh; font-family: sans-serif; color: #6b7280; background: #fffaf6; }
      .loading__spinner { width: 36px; height: 36px; border: 4px solid #fde3d3;
        border-top-color: #e8590c; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- 모든 화면은 JavaScript가 이 #app 안에 그려 넣어요 -->
    <div id="app">
      <!-- JavaScript가 준비되기 전 잠깐 보이는 로딩 화면 (준비되면 바로 바뀌어요) -->
      <div class="loading" role="status">
        <span class="loading__spinner" aria-hidden="true"></span>
        <span>뭐먹지? 불러오는 중…</span>
      </div>
    </div>
    <noscript>이 앱을 쓰려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
